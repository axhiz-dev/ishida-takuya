name: Capture screenshots and PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.screenshots.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-pdf
          path: |
            screenshots/
            playwright-screenshots-report/
          retention-days: 14
