<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提案資料用サイト画面</title>
<style>
@import url('/node_modules/@fontsource/noto-sans-jp/400.css');
@import url('/node_modules/@fontsource/noto-sans-jp/700.css');
*{box-sizing:border-box}body{margin:0;color:#243940;font-family:'Noto Sans JP',sans-serif;background:#f3f5f4}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;background:white;border-bottom:1px solid #dbe1dd}.brand{font-weight:700;font-size:23px;letter-spacing:.08em}.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:0;color:#77857e}nav{font-size:12px;display:flex;align-items:center;gap:24px}.contact{background:#225c49;color:white;padding:13px 20px;text-decoration:none;font-size:12px}.hero{position:relative;height:260px;background:center/cover url('office.jpg');display:flex;align-items:center;padding:32px}.hero div{background:#ffffffed;padding:24px 30px;max-width:390px}h1{font-size:29px;line-height:1.65;margin:8px 0 12px}p{font-size:13px;line-height:1.9;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:.1em;color:#426756}.section{padding:26px 32px;background:white}h2{font-size:20px;margin:0 0 16px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.services article{background:#f0f4f1;padding:20px;font-size:12px}.services strong{display:block;font-size:16px;margin-bottom:8px}.subhead{padding:22px 32px;background:#eaf1ed}.subhead h1{font-size:28px;margin:0}.subhead p{margin:4px 0 0}.service-page{display:grid;grid-template-columns:1fr 1fr;gap:28px}.service-page img{width:100%;height:190px;object-fit:cover}.service-page h2{margin-top:12px}.cta{padding:18px 24px;background:#eaf1ed;display:flex;justify-content:space-between;align-items:center;margin-top:22px}.cta p{margin:0;font-size:12px}.cta strong{display:block;font-size:16px;margin-bottom:4px}.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.cases img{width:100%;height:115px;object-fit:cover}.cases h3{font-size:15px;margin:8px 0}.cases p{font-size:11px}.tag{font-size:10px;color:#38715a;display:block;margin-top:10px}.facts{margin:8px 0;padding:9px 0;border-top:1px solid #dce3df;font-size:10px;line-height:1.8}footer{padding:22px 32px;color:#819089;font-size:10px;border-top:1px solid #ddd}.old{background:#e8e8e8;color:#333}.old .site{width:1000px;margin:auto;background:white}.old header{padding:14px 30px;border-top:5px solid #47687a}.old nav{gap:24px;font-size:11px}.old .brand{font-size:25px;color:#37586b}.old .hero{height:215px;background-image:url('office.jpg');padding:22px}.old .hero div{padding:12px 20px}.old h1{font-size:23px}.old .section{padding:18px 30px}.old p{font-size:11px;line-height:1.7}.old .services article{background:#f0f0f0;padding:12px}.old .subhead{background:#e8edf1}.old .subhead h1{font-size:24px}.old .contact{background:transparent;color:#666;padding:0;font-size:10px}.old .service-page{grid-template-columns:220px 1fr}.old .service-page img{height:155px}.old .cases{display:block}.old .cases article{border-bottom:1px solid #ccc;padding:12px 0;font-size:12px}.old .cases h3{font-size:13px}.old footer{color:#777}.legacy-note{font-size:11px;margin:18px 0;color:#666}
@media(max-width:500px){body:not(.old) header{padding:18px 20px}.brand{font-size:21px}body:not(.old) nav{display:none}.hero{height:260px;padding:20px}.hero div{padding:18px}.hero h1{font-size:26px}.hero p{font-size:14px}.section{padding:24px 20px}body:not(.old) .services{grid-template-columns:1fr;gap:12px}.services article{padding:16px}.old .site{transform:scale(.39);transform-origin:top left;margin:0}.old{overflow:hidden}}
</style><body><div class="site" id="site"></div><script>
const query=new URLSearchParams(location.search), old=query.get('state')==='before', topic=query.get('topic')||'mobile', past=query.get('client')==='past';
document.body.className=old?'old':'';
const name=past?'こはるオフィス':'あおば商事', roman=past?'KOHARU OFFICE':'AOBA', service=past?'オフィス移転':'オフィス家具', count=past?'2':'3';
const nav=`<nav><span>事業紹介</span><span>導入事例</span><span>会社案内</span>${old?'':`<a class="contact">ご相談・お見積もり</a>`}</nav>`;
const header=`<header><div class="brand">${roman}<small>${name}株式会社</small></div>${nav}</header>`;
const hero=`<div class="hero"><div><span class="eyebrow">OFFICE SOLUTIONS</span><h1>働く場所を、<br>もっと使いやすく。</h1><p>${service}の選定からレイアウトまで。<br>今のオフィスのお困りごとをご相談ください。</p></div></div>`;
let content='';
if(topic==='mobile') content=hero+`<section class="section"><h2>事業紹介</h2><div class="services"><article><strong>${service}</strong>人数や使い方に合うデスク・チェアをご提案。</article><article><strong>レイアウト相談</strong>働き方に合わせて、空間を見直します。</article><article><strong>納品・設置</strong>搬入から設置まで、まとめてご相談。</article></div>${old?'<p class="legacy-note">事務用品・オフィス家具・OA機器など、豊富な商品を取り扱っております。お気軽にご相談ください。</p>':''}</section>`;
if(topic==='contact')content=`<div class="subhead"><h1>${service}・レイアウト</h1><p>人数の変更や移転に合わせて、家具と配置をご提案します。</p></div><section class="section"><div class="service-page"><img src="meeting.jpg"><div><h2>ご相談いただけること</h2><p>デスク・チェアの入れ替え<br>会議スペースの新設<br>人数に合わせた配置の見直し</p><p>図面や写真があれば、打ち合わせがスムーズです。</p></div></div>${old?'<p class="legacy-note">詳細につきましては、弊社担当者までお問い合わせください。</p>':`<div class="cta"><div><strong>${service}について相談する</strong><p>図面がなくてもご相談いただけます。</p></div><a class="contact">ご相談・お見積もり</a></div>`}</section>`;
if(topic==='cases')content=`<div class="subhead"><h1>導入事例</h1><p>オフィスの広さや課題に合わせたご提案をご紹介します。</p></div><section class="section"><div class="cases">${old?'<article><h3>2019.06　会議室への家具納品</h3><p>デスク、チェアを納品いたしました。</p></article><article><h3>2018.10　オフィス移転に伴う什器納品</h3><p>事務所移転のお手伝いをいたしました。</p></article>':`<article><img src="office.jpg"><span class="tag">執務スペース ／ 24名</span><h3>増員に合わせて、<br>席と収納を再配置</h3><div class="facts">ご相談：通路が狭くなっていた<br>対応：デスク配置と収納を見直し</div></article><article><img src="meeting.jpg"><span class="tag">会議室 ／ 8名</span><h3>オンライン会議に<br>使いやすい部屋へ</h3><div class="facts">ご相談：配線が机の上に混在<br>対応：配線収納付きテーブルを選定</div></article>${past?'':`<article><img src="office.jpg" style="object-position:right"><span class="tag">受付・打ち合わせスペース</span><h3>限られた面積に、<br>打ち合わせの場所を</h3><div class="facts">ご相談：来客用の席が不足<br>対応：受付横にテーブルを新設</div></article>`}`}</div>${old?'<p class="legacy-note">掲載以外の事例については、お問い合わせください。</p>':''}</section>`;
document.getElementById('site').innerHTML=header+content+`<footer>${name}株式会社　会社案内　　アクセス　　${old?'お問い合わせ　　':''}プライバシーポリシー</footer>`;
</script></body></html>
