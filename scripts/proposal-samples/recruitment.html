<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こはるオフィス 採用情報のサンプル</title>
<style>
@import url('/node_modules/@fontsource/noto-sans-jp/400.css');
@import url('/node_modules/@fontsource/noto-sans-jp/700.css');
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans JP',sans-serif;color:#303d3b;background:#faf9f5}header{height:85px;display:flex;align-items:center;justify-content:space-between;padding:20px 42px;background:white;border-bottom:1px solid #e3e3dc}.brand{font-size:23px;font-weight:700;letter-spacing:.06em}.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:.14em;color:#7d8275}nav{font-size:12px;display:flex;gap:24px;align-items:center}nav b,.button{background:#56634c;color:white;padding:11px 20px;font-size:12px}.heading{padding:22px 42px;background:#eeeee4}.heading small{font-size:10px;letter-spacing:.16em;color:#78836d}h1{font-size:27px;margin:6px 0 0}main{padding:26px 42px}h2{font-size:18px;margin:0 0 14px}p{font-size:13px;line-height:1.9;margin:8px 0}.legacy{background:white;padding:25px 30px;border-top:2px solid #b2b8aa}.legacy h2{margin-bottom:10px}.legacy p{font-size:12px;line-height:2.1}.jobs{display:grid;grid-template-columns:1fr 1fr;gap:22px}.job{background:white;border:1px solid #d9ddcf;padding:20px}.job h2{color:#56634c;margin:0 0 6px}.job p{font-size:12px;margin-bottom:16px}dl{font-size:12px;display:grid;grid-template-columns:72px 1fr;gap:10px;margin:0}dt{color:#77806d}dd{margin:0}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.days article{background:white;border:1px solid #e3e3dc;padding-bottom:16px}.days img{width:100%;height:130px;object-fit:cover}.days strong{display:block;font-size:16px;color:#56634c;margin:12px 16px 6px}.days p{font-size:12px;margin:0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}.field{font-size:11px}.field span{display:block;margin-bottom:4px}.input{background:white;border:1px solid #cbd0c5;color:#92998a;padding:9px 12px;min-height:35px}.required{font-size:9px;color:#a05b45;margin-left:7px}.form{max-width:720px;margin:auto}.hint{font-size:12px;margin:0 0 18px}.submit{text-align:center;margin:20px 0}.submit b{display:inline-block;background:#56634c;color:white;font-size:13px;padding:12px 46px}.old .submit b{background:#666}.old .heading{background:#efefed}.old .field .input{padding:6px 10px;min-height:30px}.old main{padding-top:18px}.old .hint{margin-bottom:12px}footer{font-size:10px;padding:15px 42px;color:#8b9084;border-top:1px solid #e3e3dc}
</style><body><header><div class="brand">KOHARU OFFICE<small>RECRUITMENT　採用情報</small></div><nav><span>会社を知る</span><span>仕事を知る</span><span>募集要項</span><b>応募する</b></nav></header><div class="heading"><small>JOIN OUR TEAM</small><h1 id="title"></h1></div><main id="main"></main><footer>こはるオフィス株式会社　採用情報　　個人情報の取り扱い</footer><script>
const q=new URLSearchParams(location.search),old=q.get('state')==='before',topic=q.get('topic');document.body.className=old?'old':'';
const field=(label,value,required=true)=>`<div class="field"><span>${label}${required?'<b class="required">必須</b>':''}</span><div class="input">${value}</div></div>`;
let title='',body='';
if(topic==='jobs'){
 title='募集要項';
 body=old?`<div class="legacy"><h2>正社員募集のお知らせ</h2><p>当社では営業職および事務職を募集しております。営業職は法人のお客様へのオフィス家具の提案、事務職は受発注処理と電話対応が主な業務となります。</p><p>給与は営業職が月給25万円〜、事務職が月給22万円〜となります。いずれも経験・能力を考慮します。営業職には普通自動車運転免許、事務職には基本的なPC操作スキルが必要です。</p><p>勤務時間は営業職が9:00〜18:00、事務職が9:00〜17:30で、ともに土日祝が休日です。勤務地は東京都立川市の本社です。</p><p>詳しくは採用担当までお問い合わせください。</p></div>`:`<div class="jobs"><article class="job"><h2>法人営業</h2><p>お客様の働く場所に合う家具をご提案。</p><dl><dt>給与</dt><dd>月給25万円〜</dd><dt>勤務時間</dt><dd>9:00〜18:00</dd><dt>主な業務</dt><dd>お客様への訪問・家具の提案</dd><dt>応募条件</dt><dd>普通自動車運転免許</dd><dt>休日</dt><dd>土日祝</dd><dt>勤務地</dt><dd>立川本社</dd></dl></article><article class="job"><h2>営業事務</h2><p>受発注や電話対応で営業を支える仕事。</p><dl><dt>給与</dt><dd>月給22万円〜</dd><dt>勤務時間</dt><dd>9:00〜17:30</dd><dt>主な業務</dt><dd>受発注処理・電話対応</dd><dt>応募条件</dt><dd>基本的なPC操作</dd><dt>休日</dt><dd>土日祝</dd><dt>勤務地</dt><dd>立川本社</dd></dl></article></div>`;
}
if(topic==='day'){
 title='営業の仕事';
 body=old?`<div class="legacy"><h2>仕事内容</h2><p>営業業務全般をお任せします。</p><p>法人のお客様へのオフィス家具の販売、およびこれに付随する業務。<br>経験や適性に応じて担当業務を決定します。</p><p>明るく前向きに取り組める方をお待ちしております。</p></div>`:`<h2>営業職の一日の流れ</h2><div class="days"><article><img src="office.jpg"><strong>9:00　出社・提案準備</strong><p>メールを確認し、訪問先に持参するカタログや資料を用意します。</p></article><article><img src="meeting.jpg"><strong>10:30　お客様を訪問</strong><p>今のオフィスを見ながら、人数や使い方、困りごとを伺います。</p></article><article><img src="office.jpg" style="object-position:right"><strong>15:00　社内でプラン作成</strong><p>レイアウトと家具を検討。翌日の準備をして18時に退社します。</p></article></div>`;
}
if(topic==='entry'){
 title='採用へのご応募';
 body=`<div class="form"><p class="hint">${old?'以下の項目をご入力のうえ、履歴書を添付してください。':'まずは連絡先をお知らせください。履歴書は面談前にご提出いただきます。'}</p><div class="fields">${field('氏名','例：山田 太郎')}${field('メールアドレス','例：yamada@example.com')}${field('希望職種','営業職 / 営業事務')}${old?field('電話番号','例：090-0000-0000')+field('住所','都道府県・市区町村・番地')+field('最終学歴','学校名・卒業年月')+field('これまでの職歴','勤務先・期間・担当業務')+field('履歴書','ファイルを選択'):''}</div><div class="submit"><b>${old?'入力内容を確認する':'応募内容を確認する'}</b></div>${old?'':'<p style="text-align:center;font-size:11px">個人情報は採用のご連絡にのみ使用します。</p>'}</div>`;
}
document.getElementById('title').textContent=title;document.getElementById('main').innerHTML=body;
</script></body></html>
